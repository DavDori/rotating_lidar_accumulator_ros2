point_cloud_accumulator:
  ros__parameters:
    mech:
      lidar_frame_id: "trip/lidar_link" # rotating frame of the lidar, used with tf

    topic:
      out:
        cloud: "/trip/pointcloud"
      in:
        scan: "/trip/scan"
        trigger: "/new_sweep"
    
    pointcloud:
      frame_id: "trip/lidar_pitch_link" # point cloud accumultare in this frame
      enable_organized: false
      max_scans: 8
      azimuth:
        res_deg: 0.225
        fov_deg: 360.0
        min_deg: -180.0
      elevation:
        res_deg: 1.0
        fov_deg: 30.0
        min_deg: -15.0
